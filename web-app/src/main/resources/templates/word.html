<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head-meta :: meta}"></head>
<body>

    <div th:replace="~{sidebar :: sidebar}"></div>
	<div th:replace="~{github-link :: githublink}"></div>
	<div id="tooltip" class="tooltip"></div>

    <div class="main">
		<h1 id="word-display" class="word-display">
		            <span th:each="seg : ${segments}" th:text="${seg.text}" th:class="'seg-' + ${seg.label}"></span>
		        </h1>
		        <p id="breakdown" class="breakdown">
		            <span th:each="seg, iter : ${segments}">
		                <span th:if="${!iter.first}"> + </span>
		                <span th:text="${seg.text}"></span>
		                <span th:if="${seg.label != 'stem'}" th:text="'(' + ${seg.label} + ')'"></span>
		            </span>
		        </p>

        <div class="suffix-grid">
            <button id="btn-plural" onclick="applySuffix('plural')">Plural</button>
            <button id="btn-accusative" onclick="applySuffix('accusative')">Accusative</button>
            <button id="btn-dative" onclick="applySuffix('dative')">Dative</button>
            <button id="btn-locative" onclick="applySuffix('locative')">Locative</button>
            <button id="btn-ablative" onclick="applySuffix('ablative')">Ablative</button>
            <button id="btn-instrumental" onclick="applySuffix('instrumental')">Instrumental</button>
            <button id="btn-genitive" onclick="applySuffix('genitive')">Genitive</button>
            <button id="btn-past" onclick="applySuffix('past')">Past</button>
            <a id="link-possessive" href="/suffix/possessive"><button type="button">Possessive</button></a>
            <a id="link-copula" href="/suffix/copula"><button type="button">Copula</button></a>
        </div>
		
		<label class="color-toggle">
		            <input type="checkbox" id="color-toggle">
		            Colored suffixes
		        </label>

        <div class="utility-row">
            <form action="/" method="get">
                <button type="submit">New Word</button>
            </form>
			<form action="/undo" method="post">
			                <button type="submit" class="btn-undo">Undo</button>
			 </form>
        </div>
		
    </div>

    <script th:inline="javascript">
        const canFlags = {
            plural: /*[[${canPlural}]]*/ true,
            accusative: /*[[${canAccusative}]]*/ true,
            dative: /*[[${canDative}]]*/ true,
            locative: /*[[${canLocative}]]*/ true,
            ablative: /*[[${canAblative}]]*/ true,
            instrumental: /*[[${canInstrumental}]]*/ true,
            genitive: /*[[${canGenitive}]]*/ true,
            past: /*[[${canPast}]]*/ true,
            possessive: /*[[${canPossessive}]]*/ true,
            copula: /*[[${canCopula}]]*/ true
        };
		
		const suffixInfo = {
		            plural: ['Plural', 'Marks more than one.'],
		            accusative: ['Accusative', 'Marks the direct object of a verb.'],
		            dative: ['Dative', "Indicates direction or motion — 'to'."],
		            locative: ['Locative', "Indicates location — 'at/in'."],
		            ablative: ['Ablative', "Indicates origin — 'from'."],
		            instrumental: ['Instrumental', "Indicates means — 'with/by'."],
		            genitive: ['Genitive', "Indicates possession — 'of'."],
		            past: ['Past', 'Marks past tense.'],
		            possessive: ['Possessive', 'Marks ownership.'],
		            copula: ['Copula', "Links the subject to a state — 'to be'."]
		        };

		        const tooltip = document.getElementById('tooltip');

		        function showTooltip(label, x, y) {
		            const info = suffixInfo[label];
		            if (!info) return;
		            tooltip.innerHTML = '<strong>' + info[0] + '</strong>' + info[1];
		            tooltip.style.left = (x + 14) + 'px';
		            tooltip.style.top = (y + 14) + 'px';
		            tooltip.style.display = 'block';
		        }

		        function hideTooltip() {
		            tooltip.style.display = 'none';
		        }
		
		const colorCheckbox = document.getElementById('color-toggle');
		        colorCheckbox.checked = sessionStorage.getItem('colorMode') === 'true';
		        document.getElementById('word-display').classList.toggle('color-mode', colorCheckbox.checked);

		        colorCheckbox.addEventListener('change', function() {
		            document.getElementById('word-display').classList.toggle('color-mode', this.checked);
		            sessionStorage.setItem('colorMode', this.checked);
		        });

        function setButtonState(id, enabled) {
            const el = document.getElementById(id);
            el.disabled = !enabled;
            el.classList.toggle('btn-disabled', !enabled);
        }

		function refreshButtons(data) {
		    renderWord(data.segments);
            setButtonState('btn-plural', data.canPlural);
            setButtonState('btn-accusative', data.canAccusative);
            setButtonState('btn-dative', data.canDative);
            setButtonState('btn-locative', data.canLocative);
            setButtonState('btn-ablative', data.canAblative);
            setButtonState('btn-instrumental', data.canInstrumental);
            setButtonState('btn-genitive', data.canGenitive);
            setButtonState('btn-past', data.canPast);

            const possessiveLink = document.getElementById('link-possessive');
            possessiveLink.style.pointerEvents = data.canPossessive ? 'auto' : 'none';
            possessiveLink.querySelector('button').classList.toggle('btn-disabled', !data.canPossessive);
            possessiveLink.querySelector('button').disabled = !data.canPossessive;

            const copulaLink = document.getElementById('link-copula');
            copulaLink.style.pointerEvents = data.canCopula ? 'auto' : 'none';
            copulaLink.querySelector('button').classList.toggle('btn-disabled', !data.canCopula);
            copulaLink.querySelector('button').disabled = !data.canCopula;
        }

        function applySuffix(name) {
            fetch('/api/suffix/' + name, { method: 'POST' })
                .then(response => response.json())
                .then(data => refreshButtons(data));
        }
		
		function renderWord(segments) {
		            const wordEl = document.getElementById('word-display');
		            wordEl.innerHTML = '';
					segments.forEach(seg => {
					                const span = document.createElement('span');
					                span.textContent = seg.text;
					                span.className = 'seg-' + seg.label;
					                if (seg.label !== 'stem') {
					                    span.addEventListener('mouseenter', e => showTooltip(seg.label, e.clientX, e.clientY));
					                    span.addEventListener('mousemove', e => showTooltip(seg.label, e.clientX, e.clientY));
					                    span.addEventListener('mouseleave', hideTooltip);
					                }
					                wordEl.appendChild(span);
					            });

		            const breakdownEl = document.getElementById('breakdown');
		            breakdownEl.innerHTML = '';
		            segments.forEach((seg, i) => {
		                if (i > 0) {
		                    breakdownEl.appendChild(document.createTextNode(' + '));
		                }
		                breakdownEl.appendChild(document.createTextNode(seg.text));
		                if (seg.label !== 'stem') {
		                    breakdownEl.appendChild(document.createTextNode(' (' + seg.label + ')'));
		                }
		            });
		        }

        
			refreshButtons({
			            segments: /*[[${segments}]]*/ [],
            canPlural: canFlags.plural,
            canAccusative: canFlags.accusative,
            canDative: canFlags.dative,
            canLocative: canFlags.locative,
            canAblative: canFlags.ablative,
            canInstrumental: canFlags.instrumental,
            canGenitive: canFlags.genitive,
            canPast: canFlags.past,
            canPossessive: canFlags.possessive,
            canCopula: canFlags.copula
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turkish Morphology Builder</title>
</head>
<body>
	<h1 th:text="${word}">placeholder</h1>

	    <form action="/suffix/plural" method="post">
	        <button type="submit">Plural</button>
	    </form>
	    <form action="/suffix/accusative" method="post">
	        <button type="submit">Accusative</button>
	    </form>
	    <form action="/suffix/dative" method="post">
	        <button type="submit">Dative</button>
	    </form>
	    <form action="/suffix/locative" method="post">

	    </form>
	    <form action="/suffix/ablative" method="post">
	        <button type="submit">Ablative</button>
	    </form>
	    <form action="/suffix/instrumental" method="post">

	    </form>
	    <form action="/suffix/genitive" method="post">

	    </form>
	    <form action="/suffix/past" method="post">

		       <button type="submit">Possessive</button>

		   <form action="/suffix/copula" method="get">

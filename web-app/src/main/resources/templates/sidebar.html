<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar" class="sidebar">
        <div class="logo"> <img src="/images/morpho_logo.png" height="55" alt ="MorphoTR favicon" title="MorphoTR favicon"> MorphoTR
			
		</div>
		
        <h3>History</h3>
        <div class="sidebar-item" th:each="item : ${history}">
            <a th:href="@{/session/{id}(id=${item.id})}" th:text="${item.currentWord}">word</a>
            <form th:action="@{/session/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                <button type="submit">×</button>
            </form>
        </div>
    </div>
</body>
</html>

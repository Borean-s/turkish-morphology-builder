<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar" style="float:left; width:200px; border-right:1px solid #ccc; padding-right:10px;">
        <h3>History</h3>
        <div th:each="item : ${history}" style="margin-bottom:8px;">
            <a th:href="@{/session/{id}(id=${item.id})}" th:text="${item.currentWord}">word</a>
            <form th:action="@{/session/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                <button type="submit">x</button>
            </form>
        </div>
    </div>
</body>
</html>
